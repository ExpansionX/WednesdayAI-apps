name: Glass

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mentra-glass/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/glass.yml"
  pull_request:
    paths:
      - "apps/mentra-glass/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/glass.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Typecheck and test
        run: npm ci && npm run glass:typecheck && npm run glass:test
