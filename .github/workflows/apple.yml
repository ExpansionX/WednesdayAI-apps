name: Apple

on:
  push:
    branches: ["**"]
    paths:
      - "apps/{ios,macos,shared}/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apps/{ios,macos,shared}/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode 26.6 if present
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Swift tooling
        run: brew install xcodegen swiftformat swiftlint

      - name: Test apps/shared/OpenClawKit
        run: swift build && swift test
        working-directory: apps/shared/OpenClawKit

      - name: Test apps/shared/Swabble
        run: swift build && swift test
        working-directory: apps/shared/Swabble

      - name: Test apps/macos
        run: swift build && swift test
        working-directory: apps/macos

      - name: Lint and format-check Swift
        run: npm run lint:swift && npm run format:swift

      - name: Build iOS (simulator, no signing)
        run: npm run ios:ci

      - name: Package macOS app (ad-hoc signing)
        run: ALLOW_ADHOC_SIGNING=1 npm run mac:package
